# Deterministic answer key — Consumer Platform Unit-Economics Maturation
#
# Ground truth = the corpus files under ./corpus (Netflix / Airbnb / Zillow facts).
# Authored from the sources by Opus (2026-07-13), to be reviewed by Pierre.
#
# Three tiers, each scored differently:
#   must_cover        -> RECALL. The report MUST surface these facts/claims.
#                        Numeric facts: anchor tokens (mechanical). Qualitative
#                        claims: closed LLM-entailment (YES/NO + quote).
#   accuracy_universe -> PRECISION. Any of these figures that APPEARS in the report
#                        must match the value (after number normalization). A
#                        contradicting value = error. A specific number NOT traceable
#                        to the corpus at all = fabrication.
#   distractors       -> AGENDA DISCIPLINE. These companies are off-theme; citing
#                        them in the brief is a relevance penalty.
#
# value normalization (scorer): strip thousands separators, resolve scale
# ($000 / millions / billions), treat %, bps, ~, ± tolerantly; match within
# the tolerance in each fact (default: exact for listed decimals).

theme: "Consumer platform unit-economics maturation (Netflix, Airbnb, Zillow), 2019-2024"
companies_in_scope: [Netflix, Airbnb, Zillow]

# ---------------------------------------------------------------------------
# TIER 1 — must_cover (drives recall)
# ---------------------------------------------------------------------------
must_cover:

  # --- Netflix: ARPU expansion then plateau ---
  - id: nflx_arpu_shape
    kind: qualitative
    claim: >
      Netflix ARPU expanded from 2019 through 2022 and then plateaued / stayed
      broadly flat in 2023-2024.
    anchors_any: ["ARPU", "average revenue per"]
    verify: entailment
    source: "Financial Reference Document.md §2; Equity Research Appendix.md §IV.1"
  - id: nflx_arpu_2019
    kind: numeric
    company: Netflix
    metric: ARPU (avg monthly revenue per paying membership)
    period: 2019
    value: 10.82
    unit: USD
    anchors_all: ["Netflix", "10.82"]
    source: "Financial Reference Document.md §2"
  - id: nflx_arpu_2024
    kind: numeric
    company: Netflix
    metric: ARPU
    period: 2024
    value: 11.70
    unit: USD
    anchors_all: ["Netflix", "11.7"]
    source: "Financial Reference Document.md §2"

  # --- Airbnb: monetization via volume at a STABLE take rate ---
  - id: abnb_take_rate_stable
    kind: qualitative
    claim: >
      Airbnb's take rate stayed roughly stable (~13.3%-13.5%) across FY2022-FY2024;
      monetization grew through volume / value-per-night, not a rising take rate.
    anchors_any: ["take rate", "take-rate"]
    verify: entailment
    source: "Equity Research Appendix - Batch 3.md §9"
  - id: abnb_take_rate_fy22
    kind: numeric
    company: Airbnb
    metric: Take rate (Revenue / GBV)
    period: FY2022
    value: 13.3
    unit: percent
    anchors_all: ["Airbnb", "13.3"]
    source: "Equity Research Appendix - Batch 3.md §9"
  - id: abnb_take_rate_fy24
    kind: numeric
    company: Airbnb
    metric: Take rate
    period: FY2024
    value: 13.5
    unit: percent
    anchors_all: ["Airbnb", "13.5"]
    source: "Equity Research Appendix - Batch 3.md §9"
  - id: abnb_gbv_per_night_trend
    kind: qualitative
    claim: >
      Airbnb GBV per night booked rose modestly over FY2022-FY2024
      (~$160.53 -> ~$166.43).
    anchors_any: ["per night", "GBV per", "gross booking"]
    verify: entailment
    source: "Equity Research Appendix - Batch 4.md §14"

  # --- Zillow: FCF-margin inflection ---
  - id: z_fcf_inflection
    kind: qualitative
    claim: >
      Zillow swung from negative FCF margin in FY2022 (~-8.2%) to strongly positive
      (~20.7%) by FY2024, driven by the wind-down of its capital-intensive iBuying
      business and operating leverage.
    anchors_any: ["free cash flow", "FCF"]
    verify: entailment
    source: "Equity Research Appendix - Batch 3.md §6"
  - id: z_fcf_margin_fy22
    kind: numeric
    company: Zillow
    metric: FCF margin
    period: FY2022
    value: -8.2
    unit: percent
    anchors_all: ["Zillow", "8.2"]
    source: "Equity Research Appendix - Batch 3.md §6"
  - id: z_fcf_margin_fy24
    kind: numeric
    company: Zillow
    metric: FCF margin
    period: FY2024
    value: 20.7
    unit: percent
    anchors_all: ["Zillow", "20.7"]
    source: "Equity Research Appendix - Batch 3.md §6"

