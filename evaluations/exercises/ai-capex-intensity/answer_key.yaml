# Deterministic contract for the junior-analyst AI capex report.
# Numeric values are read from corpus/key_metrics.csv. Keeping the requirement
# dimensions here and the values in one generated table prevents silent drift.

mode: numeric
contract_version: 2
theme: "AI-era capital-expenditure intensity across six large-cap tech companies"
companies_in_scope: [Amazon, Alphabet, Meta, Microsoft, NVIDIA, Apple]
request_file: syllabus.md
require_citation: true

semantic_judge:
  model: gpt-5.4-2026-03-05
  reasoning_effort: none
  protocol: judge_then_contradictor
  authority: adequacy_veto
  requirement_sections: [adequacy_requirements]
  accepted_languages: [English, French]

numeric_requirements:
  require_latest: true
  metrics:
    - Revenue
    - Operating income
    - Operating margin
    - Operating cash flow
    - Capex
    - FCF
    - Capex/OCF
  periods:
    Amazon: FY2025
    Alphabet: FY2025
    Meta: FY2025
    Microsoft: FY2025
    NVIDIA: FY2025
    Apple: FY2025

# These local semantic checks validate the requested report, not writing style.
text_requirements:
  - id: metric_definitions
    label: "FCF and capex-intensity definitions"
    anchors_any: ["free cash flow", FCF, "capex intensity", "capex/OCF"]
    semantic_groups:
      - ["operating cash flow", OCF]
      - [subtract, minus, "-", ratio, divided, percentage, "%"]
  - id: fiscal_year_caveat
    label: "different fiscal-year ends are disclosed"
    anchors_any: ["fiscal year", "fiscal-year", "exercice fiscal", FYE]
    semantic_groups:
      - [differ, different, diffèrent, differentes, December, décembre, June, juin, January, janvier, September, septembre, clôturent]
      - [Amazon, Alphabet, Meta, Microsoft, NVIDIA, Apple]
  - id: capex_trends
    label: "capex trend direction and magnitude"
    anchors_any: [trend, rose, increased, moved, grew, declined, stable]
    semantic_groups:
      - [capex, "capital expenditure"]
      - [FY2020, FY2021, FY2022, FY2023, FY2024]
      - [FY2025]
  - id: guidance_actual_separation
    label: "guidance is separated from reported actuals"
    anchors_any: [guidance, outlook]
    semantic_groups:
      - [actual, reported, "10-K"]
      - [basis, "not like-for-like", comparable, comparison]
  - id: initial_guidance_values
    label: "frozen initial FY2025 guidance values"
    anchors_any: [guidance, outlook]
    semantic_groups:
      - [Amazon]
      - [100]
      - [Alphabet]
      - [75]
      - [Meta]
      - [60]
      - [65]
  - id: guidance_dates_and_basis
    label: "guidance release dates and Meta basis"
    anchors_any: [guidance, outlook]
    semantic_groups:
      - ["2025-02-06", "February 6, 2025", "6 February 2025"]
      - ["2025-02-04", "February 4, 2025", "4 February 2025"]
      - ["2025-01-29", "January 29, 2025", "29 January 2025"]
      - ["finance lease", "finance-lease"]
      - [principal]
  - id: guidance_gaps
    label: "unavailable initial guidance is not estimated"
    anchors_any: [unavailable, missing, "not disclosed", "not provided"]
    semantic_groups:
      - [Microsoft]
      - [NVIDIA]
      - [Apple]
      - [guidance, outlook]
  - id: data_gaps
    label: "requested source gaps are reported without estimation"
    anchors_any: ["data gap", unavailable, missing, "not disclosed", "no gap"]
    semantic_groups:
      - [source, corpus, provided]

# These closed, natural-language requirements only veto an otherwise deterministic
# finance grade when the requested junior-analyst analysis is substantively missing
# or misleading. They never award numeric credit or override a numeric verdict.
adequacy_requirements:
  - id: definitions_adequacy
    concept: "FCF and capex-intensity definitions"
    expected_answer: >-
      The report defines free cash flow as operating cash flow minus capex and capex
      intensity as capex divided by operating cash flow. The definitions are used
      consistently in the analysis.
    required_points:
      - Defines both requested measures rather than merely naming them.
      - Keeps the numerator and denominator direction correct.
    critical_errors:
      - Reverses either formula or substitutes a different cash-flow measure.
    source_files: [analyst_prep_notes.md, capex_reference_data.md]
  - id: fiscal_calendar_adequacy
    concept: "different fiscal-year ends"
    expected_answer: >-
      The report warns that fiscal calendars differ: December for Amazon, Alphabet,
      and Meta; June for Microsoft; late January for NVIDIA; and late September for
      Apple. It does not imply that every FY2025 period covers identical dates.
    required_points:
      - Discloses the cross-company fiscal-calendar comparability limitation.
      - Covers all six companies with the correct year-end grouping.
    critical_errors:
      - States or implies that all six FY2025 periods are calendar-year comparable.
    source_files: [analyst_prep_notes.md, misc_disclosures.md]
  - id: capex_trend_adequacy
    concept: "six-company capex trend analysis"
    expected_answer: >-
      For each of the six companies, the report compares the earliest capex observation
      in the frozen corpus with FY2025 and describes both direction and magnitude. The
      discussion remains factual and does not replace missing endpoints with estimates.
    required_points:
      - Includes a trend conclusion for every company in scope.
      - Uses both the earliest available endpoint and FY2025.
      - Communicates direction and magnitude, not direction alone.
    critical_errors:
      - Omits one or more companies while presenting the trend review as complete.
      - Invents an endpoint that is absent from the supplied corpus.
    source_files: [capex_reference_data.md, key_metrics.csv]
  - id: guidance_adequacy
    concept: "guidance coverage, dates, basis, and separation"
    expected_answer: >-
      A separate guidance section reports the frozen initial FY2025 guidance and release
      date for Amazon, Alphabet, and Meta, including Meta's finance-lease-principal basis.
      Microsoft, NVIDIA, and Apple are identified as unavailable in this source pack.
      Guidance is not presented as an actual, and no Meta guidance variance is calculated
      because the guidance and cash-capex actual are not like-for-like.
    required_points:
      - Separates guidance from reported FY2025 actuals.
      - Covers the three available and three unavailable companies.
      - Explains the Meta basis mismatch and avoids a guidance variance.
    critical_errors:
      - Presents guidance as a reported actual.
      - Calculates or endorses a Meta variance despite the non-comparable bases.
      - Fills unavailable guidance from model memory or an outside source.
    source_files: [capex_guidance_2025.md, analyst_prep_notes.md]
  - id: comparison_adequacy
    concept: "factual cross-company comparison"
    expected_answer: >-
      The report synthesizes the six companies using the requested profitability,
      cash-generation, capex, and capex-intensity evidence. It distinguishes scale from
      intensity and remains a neutral junior-analyst comparison rather than an investment
      recommendation.
    required_points:
      - Makes at least one substantive cross-company comparison from the requested metrics.
      - Avoids treating absolute capex and capex intensity as interchangeable.
      - Remains factual and neutral.
    critical_errors:
      - Converts the data pack into a buy, sell, ranking, or outperformance recommendation.
      - Claims that the largest capex amount necessarily has the highest capex intensity.
    source_files: [key_metrics.csv, capex_reference_data.md]
  - id: data_gap_adequacy
    concept: "actual-metric completeness and source gaps"
    expected_answer: >-
      The report explicitly states whether any of the 42 required FY2025 actual metrics
      are missing from the frozen corpus. It does not infer or estimate a missing value,
      and it distinguishes an unavailable guidance item from a missing reported actual.
    required_points:
      - Gives an explicit completeness or data-gap conclusion for required actuals.
      - Does not silently estimate missing actuals.
      - Keeps guidance availability distinct from actual-metric completeness.
    critical_errors:
      - Calls available required actuals unavailable without reconciling the supplied data.
      - Fills a claimed actual-data gap with an estimate.
    source_files: [key_metrics.csv, analyst_prep_notes.md]

accuracy_universe:
  source: corpus/key_metrics.csv

distractors:
  facts:
    - {company: Apple, metric: R&D expense, period: FY2025, value: 34.5, unit: USD_billions, keyword: "R&D"}
    - {company: Apple, metric: Dividends paid, period: FY2025, value: 15.4, unit: USD_billions, keyword: dividend}
    - {company: Microsoft, metric: R&D expense, period: FY2025, value: 32.5, unit: USD_billions, keyword: "research and development"}
    - {company: Microsoft, metric: Employees outside US, period: FY2024, value: 44.7, unit: percent, keyword: "outside the U"}

provenance:
  source_dataset: "SEC EDGAR Company Facts snapshots supplied with issue 196"
  generator: evaluations/exercises/ai-capex-intensity/generate.py
  ciks:
