# vLLM mono-model overlay for DGX Spark — generic, model-agnostic.
#
# Single overlay shared by every (model × api-path) setup running on a
# single vLLM server. Everything model-specific lives in:
#   - models/models.<setup>.env       — image, weights, parsers, hardware env
#   - configs/config-docker-dgx-<setup>.yaml — base_url, api path, agent specs
#
# Setups currently using this overlay (cf. configs/benchmark-default.yaml ›
# setup_compose_map):
#   - vllm-gptoss20b-mono       (Responses, gpt-oss-20b, vllm-node:latest)
#   - vllm-gptoss120b-mono      (Responses, gpt-oss-120b, vllm-node:latest)
#   - vllm-qwen3-27b-mono       (Responses, Qwen3.6-27B-NVFP4, vllm-node:latest)
#   - vllm-mistral-small4-mono  (Chat Completions, Mistral-Small-4-119B-NVFP4, avarok-mistral-small4:v1)
#
# Adding a new vLLM mono setup = new env file + new config file + entry
# in setup_compose_map. No new compose overlay required. See WS1 round-2
# gist Finding 9 + issue #187 for the rationale.
#
# Standard usage (via models.env symlink + generic scripts):
#   ln -sf models/models.vllm-<setup>.env models.env
#   ./scripts/start-docker-dgx.sh
#
# Direct compose usage (without symlink):
#   docker compose -f docker-compose.yml -f docker-compose.dgx-vllm-mono.yml \
#     --env-file models/models.vllm-<setup>.env up -d \
#     chromadb dataprep embeddings-gpu llm
x-llama-build: &llama-build
  build:
    context: .
    dockerfile: docker/Dockerfile.llamacpp
  image: local/llama.cpp:server-cuda

services:
  dataprep:
    command: ["dataprep_server", "--config", "${SETUP_CONFIG}"]
    volumes:
      - ./test_files:/app/test_files

  agentic-research:
    command: ["agentic-research", "--config", "${SETUP_CONFIG}"]
    depends_on:
      - dataprep
      - chromadb
      - llm
    volumes:
      - ./test_files:/app/test_files
      - ./models:/app/models:ro
      - ./benchmarks:/app/benchmarks

  chromadb:
    image: chromadb/chroma:1.4.1
    ports:
      - "8000:8000"
    volumes:
      - ./data/chromadb:/data
    environment:
      ANONYMIZED_TELEMETRY: "False"

  embeddings-gpu:
    <<: *llama-build
    volumes:
      - ${MODELS_DIR:-${HOME}/.cache/huggingface/hub}:/mnt/models
    environment:
      EXTRA_PARAMS: "${EMBEDDINGS_EXTRA_PARAMS-}"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${EMBEDDINGS_PORT:-8003}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/app/llama-server-entrypoint.sh"]
    command:
      - "-m"
      - "${EMBEDDINGS_MODEL_PATH:-/mnt/models/models--Qwen--Qwen3-Embedding-4B-GGUF/snapshots/REPLACE_WITH_SNAPSHOT/Qwen3-Embedding-4B-Q8_0.gguf}"
      - "--port"
      - "${EMBEDDINGS_PORT:-8003}"
      - "--host"
      - "0.0.0.0"
      - "--jinja"
      - "--embeddings"
    ports:
      - "${EMBEDDINGS_PORT:-8003}:${EMBEDDINGS_PORT:-8003}"

  # Single vLLM service. Every model-specific knob is parameterized via env.
  #
  # entrypoint: [""] bypasses any custom image entrypoint (avarok ships a
  # mode-dispatcher; vllm-node has none). Combined with bash -c, the command
  # form is uniform across all setups and allows env-variable interpolation
  # (incl. VLLM_EXTRA_FLAGS for model-family-specific options like
  # --tokenizer-mode mistral or --async-scheduling).
  #
  # Hardware-related env vars (VLLM_MLA_DISABLE, VLLM_NVFP4_GEMM_BACKEND,
  # VLLM_USE_FLASHINFER_MOE_FP4, VLLM_TEST_FORCE_FP8_MARLIN) are pass-through:
  # they are set in the container only if they are defined in the active
  # .env file. Mistral-Small-4 on Spark needs all four; other setups leave
  # them unset.
  llm:
    image: "${VLLM_IMAGE:-vllm-node:latest}"
    ipc: host
    shm_size: "${VLLM_SHM_SIZE:-16g}"
    entrypoint: [""]
    volumes:
      - ${MODELS_DIR:-${HOME}/.cache/huggingface/hub}:/mnt/models
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    # Hardware/runtime env vars in list form (pass-through). Compose only
    # injects a variable into the container if it is actually defined in
    # --env-file (or the surrounding shell). The dict form `VAR: "${VAR-}"`
    # was wrong here because vLLM's env validators treat empty string as
    # "set but invalid" rather than "unset":
    #   `ValueError: Invalid value '' for VLLM_NVFP4_GEMM_BACKEND.
    #    Valid options: ['flashinfer-cudnn', ..., 'marlin', 'emulation'].`
    # which broke setups that legitimately do not set these vars (Qwen,
    # gpt-oss) after the #187 collapse.
    #
    # Mistral-Small-4 on Spark sets all four (see models.vllm-mistral-small4-mono.env);
    # other setups leave them undefined and the container does not see them.
    environment:
      - HUGGING_FACE_HUB_TOKEN
      - VLLM_MLA_DISABLE
      - VLLM_NVFP4_GEMM_BACKEND
      - VLLM_USE_FLASHINFER_MOE_FP4
      - VLLM_TEST_FORCE_FP8_MARLIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "/bin/bash"
      - "-c"
      - >
        vllm serve ${VLLM_MODEL}
        --served-model-name ${VLLM_SERVED_MODEL_NAME}
        --host 0.0.0.0 --port ${VLLM_PORT:-8002}
        --max-model-len ${VLLM_MAX_MODEL_LEN:-65536}
        --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
        --enable-auto-tool-choice
        --tool-call-parser ${VLLM_TOOL_CALL_PARSER}
        --reasoning-parser ${VLLM_REASONING_PARSER}
        ${VLLM_EXTRA_FLAGS-}
        2>&1
    ports:
      - "${VLLM_PORT:-8002}:${VLLM_PORT:-8002}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${VLLM_PORT:-8002}/health').status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      # Mistral with avarok image + Marlin compile needs ~5-7 min on first
      # boot; gpt-oss/qwen with vllm-node:latest ~1-3 min. Use the longer
      # default to avoid spurious unhealthy state on first run; subsequent
      # runs hit the warmed kernel cache and are much faster.
      start_period: "${VLLM_HEALTHCHECK_START_PERIOD:-600s}"
