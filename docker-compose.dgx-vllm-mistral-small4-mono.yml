# vLLM mono-model overlay for DGX Spark — Mistral-Small-4-119B-NVFP4 (WS1 control loop).
#
# Composition: single vLLM service serving instruct + reasoning from Mistral-Small-4.
# Embeddings stay on llama.cpp. Image rebuilt locally from avarok/dgx-vllm-nvfp4-kernel:v23
# (arm64, sm_121-aware) + mistral_common >= 1.10.0 upgrade — see models/models.vllm-mistral-small4-mono.env.
#
# Source recipe: NVIDIA dev forum thread "Running Mistral-Small-4-119B-NVFP4 on NVIDIA DGX Spark GB10"
# https://forums.developer.nvidia.com/t/running-mistral-small-4-119b-nvfp4-on-nvidia-dgx-spark-gb10/363863
#
# Standard usage:
#   docker compose -f docker-compose.yml -f docker-compose.dgx-vllm-mistral-small4-mono.yml \
#     --env-file models/models.vllm-mistral-small4-mono.env up -d \
#     chromadb dataprep embeddings-gpu llm
#
# Hybrid usage (reuse already-running standalone vLLM container as `llm`):
#   docker compose ... up -d chromadb dataprep embeddings-gpu          # omit llm
#   docker network connect --alias llm agentic-research_default <standalone_container_name>
#   docker compose ... run --rm agentic-research --query "..."
x-llama-build: &llama-build
  build:
    context: .
    dockerfile: docker/Dockerfile.llamacpp
  image: local/llama.cpp:server-cuda

services:
  dataprep:
    command: ["dataprep_server", "--config", "configs/config-docker-dgx-vllm-mistral-small4-mono.yaml"]
    volumes:
      - ./test_files:/app/test_files

  agentic-research:
    command: ["agentic-research", "--config", "configs/config-docker-dgx-vllm-mistral-small4-mono.yaml"]
    depends_on:
      - dataprep
      - chromadb
    volumes:
      - ./test_files:/app/test_files
      - ./models:/app/models:ro
      - ./benchmarks:/app/benchmarks

  chromadb:
    image: chromadb/chroma:1.4.1
    ports:
      - "8000:8000"
    volumes:
      - ./data/chromadb:/data
    environment:
      ANONYMIZED_TELEMETRY: "False"

  embeddings-gpu:
    <<: *llama-build
    volumes:
      - ${MODELS_DIR:-${HOME}/.cache/huggingface/hub}:/mnt/models
    environment:
      EXTRA_PARAMS: "${EMBEDDINGS_EXTRA_PARAMS-}"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${EMBEDDINGS_PORT:-8003}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/app/llama-server-entrypoint.sh"]
    command:
      - "-m"
      - "${EMBEDDINGS_MODEL_PATH:-/mnt/models/models--Qwen--Qwen3-Embedding-4B-GGUF/snapshots/REPLACE_WITH_SNAPSHOT/Qwen3-Embedding-4B-Q8_0.gguf}"
      - "--port"
      - "${EMBEDDINGS_PORT:-8003}"
      - "--host"
      - "0.0.0.0"
      - "--jinja"
      - "--embeddings"
    ports:
      - "${EMBEDDINGS_PORT:-8003}:${EMBEDDINGS_PORT:-8003}"

  # Single vLLM service serving Mistral-Small-4-119B-NVFP4.
  # Image: avarok-mistral-small4:v1 (locally rebuilt from avarok/dgx-vllm-nvfp4-kernel:v23
  # with `RUN /opt/venv/bin/pip install --upgrade mistral_common` to support tekken.json v15).
  #
  # GB10/sm_121 specifics (forum-validated):
  #   - VLLM_MLA_DISABLE=1: standard MLA backends reject head_size=320, TRITON_MLA crashes
  #     mid-decode with shape mismatch — disable MLA entirely, use standard attention.
  #   - VLLM_NVFP4_GEMM_BACKEND=marlin: no native FP4 tensor cores on GB10, fall back to
  #     weight-only NVFP4 via Marlin kernel (warning logged at startup, perf hit accepted).
  #
  # max-model-len capped at 32K: 40K (forum default) overshoots KV cache budget at 0.75
  # gpu-memory-utilization on Spark unified 128 GB. See WS1 round-2 gist Finding 10.
  llm:
    image: "${VLLM_IMAGE:-avarok-mistral-small4:v1}"
    ipc: host
    shm_size: 16g
    runtime: nvidia
    entrypoint: ""
    volumes:
      - ${MODELS_DIR:-${HOME}/.cache/huggingface/hub}:/mnt/models
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN-}"
      VLLM_MLA_DISABLE: "${VLLM_MLA_DISABLE:-1}"
      VLLM_NVFP4_GEMM_BACKEND: "${VLLM_NVFP4_GEMM_BACKEND:-marlin}"
      VLLM_USE_FLASHINFER_MOE_FP4: "${VLLM_USE_FLASHINFER_MOE_FP4:-0}"
      VLLM_TEST_FORCE_FP8_MARLIN: "${VLLM_TEST_FORCE_FP8_MARLIN:-1}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "/bin/bash"
      - "-c"
      - >
        vllm serve ${VLLM_MODEL:-mistralai/Mistral-Small-4-119B-2603-NVFP4}
        --served-model-name ${VLLM_SERVED_MODEL_NAME:-mistral-small-4-119b}
        --tokenizer-mode mistral
        --config-format mistral
        --load-format mistral
        --host 0.0.0.0 --port ${VLLM_PORT:-8002}
        --tensor-parallel-size 1
        --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.75}
        --max-model-len ${VLLM_MAX_MODEL_LEN:-32768}
        --tool-call-parser ${VLLM_TOOL_CALL_PARSER:-mistral}
        --enable-auto-tool-choice
        --reasoning-parser ${VLLM_REASONING_PARSER:-mistral}
        2>&1
    ports:
      - "${VLLM_PORT:-8002}:${VLLM_PORT:-8002}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${VLLM_PORT:-8002}/health').status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
