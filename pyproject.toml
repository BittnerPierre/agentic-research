[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-research"
version = "0.0.1"
description = "Experiments with Agentic Research"
authors = [{name = "BittnerPierre", email = "pierre@bittner.fr"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.74.0",
    "openai-agents[litellm]>=0.2.1",
    "python-dotenv>=0.9.9",
    "fastmcp>=2.14.0",
    "mcp>=1.9.4",
    "pyyaml>=6.0.2",
    "beautifulsoup4>=4.13.4",
    "html2text>=2025.4.15",
    "lxml>=6.0.0",
    "chardet>=5.2.0",
    "portalocker>=2.8.2",
    "langsmith>=0.4.4",
    "litellm~=1.76.3",
    "chromadb==1.4.1",
    "sentence-transformers>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "tiktoken>=0.8.0",
    "requests>=2.32.0",
]

[project.scripts]
agentic-research = "src.main:cli_main"
mcp-dataprep-workflow = "src.dataprep.workflow:run_workflow"
dataprep_server = "src.mcp.dataprep_server:main"
evaluate_writer = "evaluations.write_agent_eval:eval_main"
eval-workflow = "evaluations.full_workflow_evaluator:cli_main"
baseline-eval = "evaluations.baseline_runner:cli_main"
test_trajectory = "evaluations.write_agent_eval:test_main"
benchmark-models = "evaluations.benchmark_runner:cli_main"
compare-benchmarks = "evaluations.benchmark_comparator:main"
spike-compare = "evaluations.spike_compare:main"
spike-grade = "evaluations.spike_grade:main"
deterministic-grade = "evaluations.deterministic_grade:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "evaluations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the project root on sys.path (so `import src.*` works), but DO NOT add `src/`
# directly: it would shadow the external `agents` package (openai-agents) with our
# local `src/agents` module.
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --disable-warnings --maxfail=1"
markers = [
    "integration: marks tests as integration tests (require external services)",
    "dgx: marks tests that require DGX Spark access via Tailscale VPN",
    "slow: marks tests as slow (long-running, use for comprehensive validation)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
