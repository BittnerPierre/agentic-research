# Z.ai GLM 5.3 est hébergé par l'API Mistral. Retrieval ChromaDB local et
# embeddings Qwen restent identiques aux autres campagnes cloud.
# GLM 5.3 accepte reasoning_effort=low/high/max (pas none) : low minimise le
# raisonnement pour les sous-agents de recherche et préserve la comparabilité.
config_name: glm53-mistral-decomposed
vector_store:
  name: agentic-research-dgx
  description: Vector store for the Z.ai GLM 5.3 benchmark campaign.
  expires_after_days: 30
vector_search:
  top_k: 12
  provider: chroma
  chroma_host: localhost
  chroma_port: 8000
  chroma_ssl: false
  chroma_embedding_provider: openai
  chroma_embedding_api_base: http://spark1:8003/v1
  chroma_embedding_model: Qwen3-Embedding-4B-Q8_0.gguf
  chroma_embedding_api_key_env: CHROMA_OPENAI_API_KEY
data:
  knowledge_db_path: data/knowledge_db.json
  local_storage_dir: data/
dataprep:
  llm:
    enabled: true
    model:
      name: zai-glm-5-3
      base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    temperature: 0.1
    max_tokens: 256
    timeout_seconds: 30.0
debug:
  enabled: false
  output_dir: debug_output
  save_reports: true
  show_content_preview: true
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
mcp:
  server_host: localhost
  server_port: 8001
  client_timeout_seconds: 60.0
models:
  research_model: &id001
    name: litellm/mistral/zai-glm-5-3
    api_key_env: MISTRAL_API_KEY
    max_tokens: 4096
    reasoning_effort: low
  planning_model: *id001
  search_model: *id001
  writer_model: *id001
  knowledge_preparation_model: *id001
  outline_model: *id001
  chapter_writer_model: *id001
manager:
  default_manager: deep_manager
agents:
  max_search_plan: 5-7
  output_dir: output/
  writer_output_format: markdown
  file_search_rewrite_mode: none
  file_search_rewrite_max_variants: 2
  file_search_top_k: null
  file_search_score_threshold: null
  writer_strategy: decomposed
  chapter_max_revisions: 1
  writer_max_chapters: null
