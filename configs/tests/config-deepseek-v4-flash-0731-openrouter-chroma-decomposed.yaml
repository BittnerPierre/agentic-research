# Diagnostic DSV4F-0731 via OpenRouter (#219) : MÊME workflow agentic (appels
# parallèles, contrat de livraison), même retrieval (chroma local + embeddings
# Qwen spark1:8003) que le smoke vLLM du 02/09 — seul le fournisseur du modèle
# change. Discrimination : succès ici → stack vLLM suspecte ; échec ici → le
# problème est workflow×checkpoint (réponse bavarde), indépendant du serveur.
# Clé : OPENROUTER_API_KEY dans .env (api_key_env — jamais de clé dans un YAML).
# Échantillonnage model card : temperature 1.0 / top_p 0.95, mode chat.
config_name: "deepseek-v4-flash-0731-openrouter-decomposed"

vector_store:
  name: "agentic-research-dgx"
  description: "Vector store for DeepSeek-V4-Flash-0731 OpenRouter diagnostic"
  expires_after_days: 30

vector_search:
  provider: "chroma"
  index_name: "agentic-research-dgx"
  chunk_size: 800
  chunk_overlap: 120
  chroma_host: "localhost"
  chroma_port: 8000
  chroma_ssl: false
  chroma_embedding_provider: "openai"
  chroma_embedding_api_base: "http://spark1:8003/v1"
  chroma_embedding_model: "Qwen3-Embedding-4B-Q8_0.gguf"
  chroma_embedding_api_key_env: "CHROMA_OPENAI_API_KEY"
  top_k: 12
  score_threshold: null

data:
  knowledge_db_path: "data/knowledge_db.json"
  local_storage_dir: "data/"

debug:
  enabled: false
  output_dir: "debug_output"
  save_reports: true
  show_content_preview: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

mcp:
  server_host: "localhost"
  server_port: 8001
  client_timeout_seconds: 60.0
  http_timeout_seconds: 5.0

models:
  # DeepSeek-V4-Flash-0731 servi par OpenRouter — handle deepseek/deepseek-v4-flash-0731,
  # endpoint OpenAI-compatible (Chat Completions par défaut avec base_url).
  search_model: &dsv4or
    name: "openai/deepseek/deepseek-v4-flash-0731"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    reasoning_effort: "none"
    temperature: 1.0
    top_p: 0.95
  planning_model: *dsv4or
  knowledge_preparation_model: *dsv4or
  research_model: *dsv4or
  outline_model: *dsv4or
  writer_model: *dsv4or
  chapter_writer_model: *dsv4or

manager:
  default_manager: "deep_manager"

agents:
  max_search_plan: "5-7"
  output_dir: "output/"
  writer_output_format: "markdown"
  writer_strategy: "decomposed"
  chapter_max_revisions: 1
