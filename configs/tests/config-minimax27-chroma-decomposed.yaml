# Campagne modèles medium — MiniMax M2.7 (cyankiwi/MiniMax-M2.7-AWQ-4bit) sur vLLM spark1.
# Série M2 orientée agentique/tool-use. Instruct par défaut (pas de reasoning_effort
# explicite — on ajuste si besoin). Retrieval ChromaDB + embeddings Qwen3 @ spark1:8003.
config_name: "minimax27-decomposed"

vector_store:
  name: "agentic-research-dgx"
  description: "Vector store for minimax2.7 campaign"
  expires_after_days: 30

vector_search:
  provider: "chroma"
  index_name: "agentic-research-dgx"
  chunk_size: 800
  chunk_overlap: 120
  chroma_host: "localhost"
  chroma_port: 8000
  chroma_ssl: false
  chroma_embedding_provider: "openai"
  chroma_embedding_api_base: "http://spark1:8003/v1"
  chroma_embedding_model: "Qwen3-Embedding-4B-Q8_0.gguf"
  chroma_embedding_api_key_env: "CHROMA_OPENAI_API_KEY"
  top_k: 12
  score_threshold: null

data:
  knowledge_db_path: "data/knowledge_db.json"
  local_storage_dir: "data/"

debug:
  enabled: false
  output_dir: "debug_output"
  save_reports: true
  show_content_preview: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

mcp:
  server_host: "localhost"
  server_port: 8001
  client_timeout_seconds: 60.0
  http_timeout_seconds: 5.0

models:
  research_model: &mm
    name: "openai/cyankiwi/MiniMax-M2.7-AWQ-4bit"
    base_url: "http://spark1:8000/v1"
    api_key: "dummy"
  planning_model: *mm
  search_model: *mm
  writer_model: *mm
  knowledge_preparation_model: *mm
  outline_model: *mm
  chapter_writer_model: *mm

manager:
  default_manager: "deep_manager"

agents:
  max_search_plan: "5-7"
  output_dir: "output/"
  writer_output_format: "markdown"
  writer_strategy: "decomposed"
  chapter_max_revisions: 1
