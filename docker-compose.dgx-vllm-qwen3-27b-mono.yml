# vLLM mono-model overlay for DGX Spark — Qwen3.6-27B-NVFP4 (WS1 control loop).
#
# Composition: single vLLM service serving instruct + reasoning from Qwen3.6-27B.
# Embeddings stay on llama.cpp. Image: vllm-node:latest (eugr local build,
# same as gpt-oss mono). Architecture dense → no MLA bug, no FP4 hardware
# workarounds needed beyond the standard eugr image.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dgx-vllm-qwen3-27b-mono.yml \
#     --env-file models/models.vllm-qwen3-27b-mono.env up -d \
#     chromadb dataprep embeddings-gpu llm
x-llama-build: &llama-build
  build:
    context: .
    dockerfile: docker/Dockerfile.llamacpp
  image: local/llama.cpp:server-cuda

services:
  dataprep:
    command: ["dataprep_server", "--config", "configs/config-docker-dgx-vllm-qwen3-27b-mono.yaml"]
    volumes:
      - ./test_files:/app/test_files

  agentic-research:
    command: ["agentic-research", "--config", "configs/config-docker-dgx-vllm-qwen3-27b-mono.yaml"]
    depends_on:
      - dataprep
      - chromadb
    volumes:
      - ./test_files:/app/test_files
      - ./models:/app/models:ro
      - ./benchmarks:/app/benchmarks

  chromadb:
    image: chromadb/chroma:1.4.1
    ports:
      - "8000:8000"
    volumes:
      - ./data/chromadb:/data
    environment:
      ANONYMIZED_TELEMETRY: "False"

  embeddings-gpu:
    <<: *llama-build
    volumes:
      - ${MODELS_DIR:-${HOME}/.cache/huggingface/hub}:/mnt/models
    environment:
      EXTRA_PARAMS: "${EMBEDDINGS_EXTRA_PARAMS-}"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${EMBEDDINGS_PORT:-8003}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/app/llama-server-entrypoint.sh"]
    command:
      - "-m"
      - "${EMBEDDINGS_MODEL_PATH:-/mnt/models/models--Qwen--Qwen3-Embedding-4B-GGUF/snapshots/REPLACE_WITH_SNAPSHOT/Qwen3-Embedding-4B-Q8_0.gguf}"
      - "--port"
      - "${EMBEDDINGS_PORT:-8003}"
      - "--host"
      - "0.0.0.0"
      - "--jinja"
      - "--embeddings"
    ports:
      - "${EMBEDDINGS_PORT:-8003}:${EMBEDDINGS_PORT:-8003}"

  # Single vLLM service serving Qwen3.6-27B-NVFP4.
  # Validated 2026-05-11 (curl level): chat completions + tools + responses
  # all return clean structured function_call. End-to-end agentic-research
  # run TBD as of overlay creation.
  #
  # Parsers (validated):
  #   - tool-call: qwen3_coder (pythonic-XML <function=...><parameter=...>).
  #     `hermes` does NOT work — expects JSON in <tool_call>, model emits XML.
  #   - reasoning: qwen3 (clean <think>...</think> parsing).
  llm:
    image: "${VLLM_IMAGE:-vllm-node:latest}"
    ipc: host
    volumes:
      - ${MODELS_DIR:-${HOME}/.cache/huggingface/hub}:/mnt/models
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN-}"
      VLLM_EXTRA_PARAMS: "${VLLM_EXTRA_PARAMS-}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "vllm"
      - "serve"
      - "${VLLM_MODEL:-unsloth/Qwen3.6-27B-NVFP4}"
      - "--served-model-name"
      - "${VLLM_SERVED_MODEL_NAME:-qwen3.6-27b}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${VLLM_PORT:-8002}"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-65536}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.85}"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "${VLLM_TOOL_CALL_PARSER:-qwen3_coder}"
      - "--reasoning-parser"
      - "${VLLM_REASONING_PARSER:-qwen3}"
      - "--max-num-seqs"
      - "128"
    ports:
      - "${VLLM_PORT:-8002}:${VLLM_PORT:-8002}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${VLLM_PORT:-8002}/health').status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
